<!-- doc-style.html: the look of the HTML documents in the Windows package
     (build-windows-cross.sh puts it into each one with pandoc -H) -->
<style>
  html {
    font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color: #1d1d1f;
    background-color: #fdfdfd;
  }
  body {
    max-width: 52em;
    margin: 0 auto;
    padding: 2em 2.5em 4em;
    font-size: 1em;
    hyphens: manual;
  }
  h1, h2, h3, h4 {
    line-height: 1.25;
    margin-top: 1.6em;
  }
  h1 { font-size: 1.9em; }
  h2 { font-size: 1.45em; border-bottom: 1px solid #d8d8dc; padding-bottom: 0.2em; }
  h3 { font-size: 1.2em; }
  a { color: #0b57b0; }
  a:visited { color: #6a3fa0; }
  code, pre {
    font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
    font-size: 0.92em;
  }
  code { background-color: #f0f0f3; padding: 0.05em 0.25em; border-radius: 3px; }
  pre { background-color: #f4f4f6; padding: 0.7em 1em; overflow-x: auto; }
  pre code { background-color: transparent; padding: 0; }
  table { border-collapse: collapse; margin: 1em 0; }
  th, td { border: 1px solid #d0d0d6; padding: 0.3em 0.7em; text-align: left; }
  th { background-color: #f0f0f3; }
  /* The man page's indented paragraphs (the descriptions of the options)
     come as block quotes */
  blockquote { margin: 0.2em 0 0.8em 1.8em; padding-left: 0; border-left: none; color: inherit; }
  dt { font-weight: 600; margin-top: 0.6em; }
  dd { margin-left: 2em; }
  nav#TOC { background-color: #f6f6f8; border: 1px solid #e0e0e4; padding: 0.5em 1.5em; }
  nav#TOC ul { padding-left: 1.2em; }
  @media (prefers-color-scheme: dark) {
    html { color: #e6e6e8; background-color: #1c1c1e; }
    h2 { border-bottom-color: #3a3a3e; }
    a { color: #6cb0ff; }
    a:visited { color: #c09cf0; }
    code { background-color: #2c2c30; }
    pre, nav#TOC { background-color: #252528; border-color: #3a3a3e; }
    th { background-color: #2c2c30; }
    th, td { border-color: #3a3a3e; }
  }
  @media print {
    body { max-width: none; padding: 0; }
    nav#TOC { display: none; }
  }
</style>
